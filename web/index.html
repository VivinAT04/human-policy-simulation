<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Human Policy Simulation</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f5f7;
    color: #171717;
}

header {
    background: #111827;
    color: white;
    padding: 20px 28px;
}

header h1 {
    margin: 0 0 5px;
    font-size: 24px;
}

header p {
    margin: 0;
    color: #cbd5e1;
}

main {
    display: grid;
    grid-template-columns: minmax(600px, 1fr) 320px;
    gap: 24px;
    padding: 24px;
    max-width: 1250px;
    margin: auto;
}

.panel {
    background: white;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.grid-wrap {
    display: flex;
    justify-content: center;
    overflow: auto;
}

#grid {
    display: grid;
    width: min(72vh, 700px);
    height: min(72vh, 700px);
    border: 2px solid #111827;
}

.cell {
    position: relative;
    border: 1px solid #e5e7eb;
    background: white;
}

.start {
    background: #dbeafe;
}

.goal {
    background: #dcfce7;
}

.visited {
    background: #fef3c7;
}

.cell-label {
    position: absolute;
    font-size: 8px;
    left: 2px;
    top: 1px;
    opacity: .35;
}

.marker {
    position: absolute;
    inset: 15%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    border-radius: 50%;
}

.start-marker {
    background: #2563eb;
    color: white;
}

.goal-marker {
    background: #16a34a;
    color: white;
}

#wheelchair {
    position: absolute;
    inset: 8%;
    background: #111827;
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    z-index: 10;
    transition: transform .2s;
}

.controls {
    display: flex;
    gap: 8px;
    margin-top: 18px;
    justify-content: center;
    flex-wrap: wrap;
}

button {
    border: 0;
    border-radius: 7px;
    padding: 10px 15px;
    cursor: pointer;
    font-weight: 600;
}

.primary {
    background: #111827;
    color: white;
}

.secondary {
    background: #e5e7eb;
}

.metric {
    padding: 12px 0;
    border-bottom: 1px solid #e5e7eb;
}

.metric small {
    color: #6b7280;
    display: block;
    margin-bottom: 3px;
}

.metric strong {
    font-size: 18px;
}

.status {
    margin-top: 16px;
    padding: 12px;
    border-radius: 8px;
    background: #f3f4f6;
    line-height: 1.6;
}

.legend {
    margin-top: 20px;
    font-size: 13px;
    line-height: 2;
}

.box {
    width: 14px;
    height: 14px;
    display: inline-block;
    margin-right: 7px;
    vertical-align: middle;
    border: 1px solid #aaa;
}

@media (max-width: 900px) {
    main {
        grid-template-columns: 1fr;
    }
}

</style>
</head>

<body>
<main>

<section class="panel">

    <div class="grid-wrap">
        <div id="grid"></div>
    </div>

    <div class="controls">

        <select
            id="policySelect"
            onchange="changePolicy(this.value)"
            style="
                padding:10px 14px;
                border:1px solid #d1d5db;
                border-radius:8px;
                background:white;
                font-weight:700;
                min-width:210px;
            "
        >
            <option value="dp">
                Dynamic Programming
            </option>

            <option value="q_learning">
                Q-Learning
            </option>

            <option value="mcts">
                MCTS
            </option>
        </select>

        <select
            id="noiseSelect"
            onchange="changeNoise(this.value)"
            style="
                padding:10px 14px;
                border:1px solid #d1d5db;
                border-radius:8px;
                background:white;
                font-weight:700;
                min-width:120px;
            "
        >
            <option value="0.0">Noise 0%</option>
            <option value="0.1">Noise 10%</option>
            <option value="0.2">Noise 20%</option>
            <option value="0.3">Noise 30%</option>
            <option value="0.4">Noise 40%</option>
            <option value="0.5">Noise 50%</option>
        </select>

        <button class="primary" onclick="play()">
            ▶ Run
        </button>

        <button class="secondary" onclick="pause()">
            ⏸ Pause
        </button>

        <button class="secondary" onclick="nextStep()">
            Next Step
        </button>

        <button class="secondary" onclick="resetSimulation()">
            Reset
        </button>

    </div>

</section>


<aside class="panel">

    <h2 style="margin-top:0">Policy</h2>

    <div class="metric">
        <small>Algorithm</small>
        <strong id="algorithm">—</strong>
    </div>

    <div class="metric">
        <small>Current Step</small>
        <strong id="step">0</strong>
    </div>

    <div class="metric">
        <small>Position</small>
        <strong id="position">—</strong>
    </div>

    <div class="metric">
        <small>Heading</small>
        <strong id="heading">—</strong>
    </div>

    <div class="metric">
        <small>Policy Action</small>
        <strong id="action">—</strong>
    </div>

    <div class="metric">
        <small>Executed Action</small>
        <strong id="executedAction">—</strong>
    </div>

    <div class="metric">
        <small>Noise</small>
        <strong id="noiseValue">0%</strong>
    </div>

    <div class="metric">
        <small>Corrupted</small>
        <strong id="corrupted">NO</strong>
    </div>

    <div class="metric">
        <small>Corrupted Actions</small>
        <strong id="corruptedTotal">0</strong>
    </div>

    <div class="metric">
        <small>Blocked Moves</small>
        <strong id="blockedMoves">0</strong>
    </div>

    <div class="metric">
        <small id="specialLabel">DP Convergence</small>
        <strong id="iterations">—</strong>
    </div>

    <div class="metric">
        <small>Total Actions</small>
        <strong id="actions">—</strong>
    </div>

    <div class="metric">
        <small>Total Reward</small>
        <strong id="reward">—</strong>
    </div>

    <div id="status" class="status">
        Ready.
    </div>

    <div class="legend">
        <div>
            <span class="box" style="background:#dbeafe"></span>
            Start
        </div>

        <div>
            <span class="box" style="background:#dcfce7"></span>
            Goal
        </div>

        <div>
            <span class="box" style="background:#fef3c7"></span>
            <span id="trajectoryLabel">DP trajectory</span>
        </div>

        <div>
            <span class="box" style="background:#111827"></span>
            Wheelchair
        </div>
    </div>

</aside>

</main>


<script>

let simulationData;
let cleanData;
let data;

let currentPolicy = "dp";
let currentNoise = "0.0";

let current = 0;
let timer = null;


async function initialise() {

    const [
        noiseResponse,
        cleanResponse
    ] = await Promise.all([
        fetch(
            "noise_trajectories.json?ts=" +
            Date.now()
        ),
        fetch(
            "policy_trajectories.json?ts=" +
            Date.now()
        )
    ]);

    if (!noiseResponse.ok) {
        throw new Error(
            "Could not load noise trajectories."
        );
    }

    if (!cleanResponse.ok) {
        throw new Error(
            "Could not load clean policy data."
        );
    }

    simulationData =
        await noiseResponse.json();

    cleanData =
        await cleanResponse.json();

    loadSimulation();
}


function changePolicy(value) {

    currentPolicy = value;

    pause();
    loadSimulation();
}


function changeNoise(value) {

    currentNoise = value;

    pause();
    loadSimulation();
}


function loadSimulation() {

    const policy =
        simulationData
            .policies[currentPolicy];

    const run =
        policy
            .noise_runs[currentNoise];

    const cleanPolicy =
        cleanData
            .policies[currentPolicy];

    data = {
        rows:
            simulationData.rows,

        cols:
            simulationData.cols,

        start: [
            simulationData.start.row,
            simulationData.start.col
        ],

        goal: [
            simulationData.goal.row,
            simulationData.goal.col
        ],

        display_name:
            policy.display_name,

        algorithm:
            policy.algorithm,

        success:
            run.success,

        actions:
            run.total_actions,

        total_reward:
            run.total_reward,

        blocked_moves:
            run.blocked_moves,

        corrupted_actions:
            run.corrupted_actions,

        noise_percent:
            run.noise_percent,

        clean_extra:
            cleanPolicy.extra,

        steps:
            run.trajectory.map(
                item => ({
                    step:
                        item.step,

                    row:
                        item.state.row,

                    col:
                        item.state.col,

                    heading:
                        item.state.heading,

                    intended_action:
                        item.intended_action,

                    executed_action:
                        item.executed_action,

                    corrupted:
                        item.corrupted,

                    blocked:
                        item.blocked,

                    reward:
                        item.reward
                })
            )
    };

    current = 0;

    document.getElementById(
        "policySelect"
    ).value = currentPolicy;

    document.getElementById(
        "noiseSelect"
    ).value = currentNoise;

    updatePanel();
    createGrid();
    showStep(0);
}


function updatePanel() {

    document.getElementById(
        "algorithm"
    ).textContent =
        data.algorithm;

    document.getElementById(
        "actions"
    ).textContent =
        data.actions;

    document.getElementById(
        "reward"
    ).textContent =
        Number(
            data.total_reward
        ).toFixed(1);

    document.getElementById(
        "noiseValue"
    ).textContent =
        data.noise_percent + "%";

    document.getElementById(
        "corruptedTotal"
    ).textContent =
        data.corrupted_actions;

    document.getElementById(
        "blockedMoves"
    ).textContent =
        data.blocked_moves;

    const label =
        document.getElementById(
            "specialLabel"
        );

    const value =
        document.getElementById(
            "iterations"
        );

    const trajectoryLabel =
        document.getElementById(
            "trajectoryLabel"
        );

    if (currentPolicy === "dp") {

        label.textContent =
            "DP Convergence";

        value.textContent =
            data.clean_extra
                .convergence_iterations;

        trajectoryLabel.textContent =
            "DP trajectory";

    } else if (
        currentPolicy === "q_learning"
    ) {

        label.textContent =
            "Training";

        value.textContent =
            Number(
                data.clean_extra
                    .training_episodes
            ).toLocaleString()
            + " episodes";

        trajectoryLabel.textContent =
            "Q-Learning trajectory";

    } else {

        label.textContent =
            "Search Budget";

        value.textContent =
            data.clean_extra
                .simulations_per_action
            + " simulations/action";

        trajectoryLabel.textContent =
            "MCTS trajectory";
    }
}


function createGrid() {

    const grid =
        document.getElementById("grid");

    grid.style.gridTemplateColumns =
        `repeat(${data.cols}, 1fr)`;

    grid.style.gridTemplateRows =
        `repeat(${data.rows}, 1fr)`;

    grid.innerHTML = "";

    for (
        let row = 0;
        row < data.rows;
        row++
    ) {

        for (
            let col = 0;
            col < data.cols;
            col++
        ) {

            const cell =
                document.createElement(
                    "div"
                );

            cell.className = "cell";

            cell.id =
                `cell-${row}-${col}`;

            if (
                row === data.start[0] &&
                col === data.start[1]
            ) {

                cell.classList.add(
                    "start"
                );

                const marker =
                    document.createElement(
                        "div"
                    );

                marker.className =
                    "marker start-marker";

                marker.textContent = "A";

                cell.appendChild(marker);
            }

            if (
                row === data.goal[0] &&
                col === data.goal[1]
            ) {

                cell.classList.add(
                    "goal"
                );

                const marker =
                    document.createElement(
                        "div"
                    );

                marker.className =
                    "marker goal-marker";

                marker.textContent = "B";

                cell.appendChild(marker);
            }

            grid.appendChild(cell);
        }
    }
}


function headingArrow(heading) {

    if (heading === "NORTH")
        return "↑";

    if (heading === "EAST")
        return "→";

    if (heading === "SOUTH")
        return "↓";

    if (heading === "WEST")
        return "←";

    return "●";
}


function showStep(index) {

    if (
        index >= data.steps.length
    ) {
        return;
    }

    const step =
        data.steps[index];

    document
        .querySelectorAll(
            "#wheelchair"
        )
        .forEach(
            el => el.remove()
        );

    const cell =
        document.getElementById(
            `cell-${step.row}-${step.col}`
        );

    if (!cell)
        return;

    cell.classList.add(
        "visited"
    );

    const wheelchair =
        document.createElement(
            "div"
        );

    wheelchair.id =
        "wheelchair";

    wheelchair.textContent =
        headingArrow(
            step.heading
        );

    cell.appendChild(
        wheelchair
    );

    document.getElementById(
        "step"
    ).textContent =
        `${step.step} / ${data.actions}`;

    document.getElementById(
        "position"
    ).textContent =
        `(${step.row}, ${step.col})`;

    document.getElementById(
        "heading"
    ).textContent =
        step.heading;

    document.getElementById(
        "action"
    ).textContent =
        step.intended_action;

    document.getElementById(
        "executedAction"
    ).textContent =
        step.executed_action;

    document.getElementById(
        "corrupted"
    ).textContent =
        step.corrupted
            ? "YES"
            : "NO";

    const status =
        document.getElementById(
            "status"
        );

    if (index === 0) {

        status.textContent =
            `${data.display_name} ready ` +
            `with ${data.noise_percent}% noise.`;

    } else if (
        index ===
        data.steps.length - 1
    ) {

        if (data.success) {

            status.innerHTML =
                "<strong>Goal reached ✓</strong><br>" +
                `${data.display_name} reached B ` +
                `in ${data.actions} actions.`;

        } else {

            status.innerHTML =
                "<strong>Goal not reached</strong><br>" +
                `${data.display_name} stopped after ` +
                `${data.actions} actions.`;
        }

        pause();

    } else if (
        step.corrupted
    ) {

        status.textContent =
            `Noise changed ${step.intended_action} ` +
            `→ ${step.executed_action}.`;

    } else {

        status.textContent =
            `Executed ${step.executed_action}.`;
    }
}


function nextStep() {

    if (
        current >=
        data.steps.length - 1
    ) {
        return;
    }

    current++;
    showStep(current);
}


function play() {

    if (timer)
        return;

    if (
        current >=
        data.steps.length - 1
    ) {
        resetSimulation();
    }

    timer = setInterval(
        () => {

            if (
                current >=
                data.steps.length - 1
            ) {
                pause();
                return;
            }

            nextStep();

        },
        180
    );
}


function pause() {

    if (timer) {

        clearInterval(timer);
        timer = null;
    }
}


function resetSimulation() {

    pause();

    current = 0;

    document
        .querySelectorAll(
            ".visited"
        )
        .forEach(
            cell =>
                cell.classList.remove(
                    "visited"
                )
        );

    document
        .querySelectorAll(
            "#wheelchair"
        )
        .forEach(
            el => el.remove()
        );

    showStep(0);
}


initialise().catch(
    error => {

        console.error(error);

        document.getElementById(
            "status"
        ).textContent =
            "Failed to load simulation: "
            + error.message;
    }
);

</script>

</body>
</html>
